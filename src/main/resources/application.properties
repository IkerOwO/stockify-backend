spring.application.name=stockify

# Para bloquear las peticiones a la API
server.tomcat.threads.max=150
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=8192
server.tomcat.accept-count=100

# Configuracion de la conexion a la BBDD
spring.datasource.url=jdbc:mysql://localhost:3306/stockify
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.datasource-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create